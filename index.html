<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Jump Game 🦖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 200px;
            background-color: #fff;
            border-bottom: 2px solid #333;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #dino {
            position: absolute;
            bottom: 0px;
            left: 50px;
            width: 40px;
            height: 40px;
            background-color: #2ecc71;
            border-radius: 4px;
        }
        .jump {
            animation: jumpAnimation 0.5s ease-out;
        }
        @keyframes jumpAnimation {
            0% { bottom: 0px; }
            50% { bottom: 100px; }
            100% { bottom: 0px; }
        }
        #cactus {
            position: absolute;
            bottom: 0px;
            right: -20px;
            width: 20px;
            height: 40px;
            background-color: #e74c3c;
            border-radius: 4px;
        }
        .cactus-move {
            animation: cactusAnimation 1.5s infinite linear;
        }
        @keyframes cactusAnimation {
            0% { right: -20px; }
            100% { right: 600px; }
        }
        #score-board {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
            text-align: center;
        }
        .instructions {
            margin-bottom: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="instructions">กด **Spacebar** หรือ **แตะหน้าจอ** เพื่อกระโดด!</div>
    
    <div id="game-container" onclick="jump()">
        <div id="dino"></div>
        <div id="cactus" class="cactus-move"></div>
        <div id="game-over">GAME OVER<br><span style="font-size: 16px; color: #555;">กด Spacebar เพื่อเริ่มใหม่</span></div>
    </div>

    <div id="score-board">คะแนน: <span id="score">0</span></div>

    <script>
        const dino = document.getElementById("dino");
        const cactus = document.getElementById("cactus");
        const scoreElement = document.getElementById("score");
        const gameOverText = document.getElementById("game-over");

        let score = 0;
        let isAlive = true;
        let scoreInterval;

        function jump() {
            if (!isAlive) {
                resetGame();
                return;
            }
            if (!dino.classList.contains("jump")) {
                dino.classList.add("jump");
                setTimeout(function () {
                    dino.classList.remove("jump");
                }, 500);
            }
        }

        document.addEventListener("keydown", function (event) {
            if (event.code === "Space") {
                jump();
            }
        });

        function startScoreCounter() {
            scoreInterval = setInterval(() => {
                if (isAlive) {
                    score++;
                    scoreElement.innerText = score;
                }
            }, 100);
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            isAlive = true;
            gameOverText.style.display = "none";
            cactus.classList.add("cactus-move");
            startScoreCounter();
        }

        // ตรวจสอบการชนกัน (Collision Detection)
        let checkDead = setInterval(function () {
            if (!isAlive) return;

            let dinoBottom = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
            let cactusRight = parseInt(window.getComputedStyle(cactus).getPropertyValue("right"));

            // คำนวณตำแหน่งว่ากระบองเพชรวิ่งมาชนไดโนเสาร์หรือไม่
            if (cactusRight > 510 && cactusRight < 550 && dinoBottom <= 40) {
                cactus.classList.remove("cactus-move");
                gameOverText.style.display = "block";
                isAlive = false;
                clearInterval(scoreInterval);
            }
        }, 10);

        startScoreCounter();
    </script>
</body>
</html>
